<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- จุดที่ 1: ชื่อบนแถบ Title เบราว์เซอร์ -->
    <title>หน้าแรก - รัฐภูมิ เล่าคุ้ม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <!-- จุดที่ 2: ชื่อบนโลโก้/Navbar มุมซ้ายบน (ตรงคำว่า "ชื่อ-นามสกุลของคุณ") -->
            <span class="site-title">รัฐภูมิ เล่าคุ้ม</span>
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html" class="active">หน้าแรก</a></li>
                    <li><a href="experience.html">ประวัติการทำงาน</a></li>
                    <li><a href="projects.html">ผลงาน</a></li>
                    <li><a href="contact.html">ติดต่อ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="profile-card">
            <div class="profile-avatar-wrapper">
                <!-- จุดเสริม: alt text ของรูปภาพ -->
                <img src="images/profile.jpg" alt="รัฐภูมิ เล่าคุ้ม" class="profile-avatar">
            </div>

            <div class="profile-info">
                <span class="profile-tagline">นักศึกษาวิศวกรรมศาสตร์ | ผู้พัฒนาเว็บไซต์</span>
                
                <!-- จุดที่ 3: ชื่อหัวข้อใหญ่กลางหน้าเว็บ (ตรงคำว่า "[ใส่ชื่อของคุณ]") -->
                <h1 class="profile-name">สวัสดีครับ ผมชื่อ รัฐภูมิ เล่าคุ้ม</h1>
                
                <p class="profile-bio">
                    ผมกำลังศึกษาอยู่ชั้นปีที่ 3 สนใจงานด้าน การพัฒนาเว็บไซต์ และระบบอิเล็กทรอนิกส์ และกำลังมองหาโอกาสฝึกงานเพื่อพัฒนาทักษะในสายงานนี้ครับ
                </p>

                <div class="action-buttons">
                    <a href="contact.html" class="btn btn-primary">ติดต่องาน</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
